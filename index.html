  function donutHTML(st) {
    var rows = [
      { k: '已掌握', v: st.dist.mastered, c: '#5f4fd8' },
      { k: '熟练', v: st.dist.skilled, c: '#8b7cf6' },
      { k: '熟悉', v: st.dist.familiar, c: '#b7aafb' },
      { k: '巩固中', v: st.dist.learning, c: '#f0c070' },
      { k: '初学', v: st.dist.fresh, c: '#ddd8ce' }
    ];
    var total = rows.reduce(function (a, r) { return a + r.v; }, 0) || 1;
    var R = 52, C = 2 * Math.PI * R, offset = 0;
    var arcs = rows.map(function (r) {
      var len = (r.v / total) * C;
      var seg = '<circle cx="70" cy="70" r="' + R + '" fill="none" stroke="' + r.c + '" stroke-width="17" ' +
        'stroke-dasharray="' + Math.max(0, len - 2) + ' ' + (C - Math.max(0, len - 2)) + '" ' +
        'stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 70 70)" stroke-linecap="round"/>';
      offset += len;
      return seg;
    }).join('');

    return '<div class="donut-wrap">' +
      '<svg viewBox="0 0 140 140">' + arcs +
      '<text x="70" y="67" text-anchor="middle" font-size="21" font-weight="600" fill="#1c1f26">' + total + '</text>' +
      '<text x="70" y="84" text-anchor="middle" font-size="9.5" fill="#7d8594">张内容</text></svg>' +
      '<div class="donut-legend">' + rows.map(function (r) {
        return '<div><i style="background:' + r.c + '"></i><span>' + r.k + '</span><b>' + r.v + '</b></div>';
      }).join('') + '</div>' +
    '</div>';
  }

  function barsHTML(days) {

      var h = d.count ? Math.max(8, Math.round((d.count / max) * 100)) : 3;
      return '<div class="bar-col' + (d.key === todayKey ? ' today' : '') + '" title="' + d.label + ' · ' + d.count + ' 次">' +
        '<div class="bar' + (d.count ? '' : ' zero') + '" style="height:' + h + '%" data-v="' + d.count + ' 次"></div>' +
        '<em>' + (d.key === todayKey ? '今天' : d.label) + '</em>' +

  function pickedTags() {
    return $$('#tagPicker .tag-chip.on[data-tag]').map(function (b) { return b.getAttribute('data-tag'); });
  }

  function syncTagsInput() {
    var input = $('#tagsInput');
    if (input) input.value = pickedTags().join(', ');
  }

  function closeTagCustom() {
    var wrap = $('#tagCustomWrap');
    if (wrap) {
      wrap.classList.add('hidden');
      var ci = $('#tagCustomInput');
      if (ci) ci.value = '';
    }
    var addBtn = $('#tagAddBtn');
    if (addBtn) addBtn.classList.remove('hidden');
  }

  function commitCustomTag() {
    var ci = $('#tagCustomInput');
    var name = ci ? ci.value.trim().replace(/[,，]/g, '').slice(0, 8) : '';
    if (!name) { closeTagCustom(); return; }
    if (pickedTags().length >= 5) { toast('标签最多 5 个'); return; }
    var existing = $$('#tagPicker .tag-chip[data-tag]').filter(function (b) {
      return b.getAttribute('data-tag') === name;
    })[0];
    if (existing) {
      existing.classList.add('on');
    } else {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'tag-chip on';
      chip.setAttribute('data-act', 'tagToggle');
      chip.setAttribute('data-tag', name);
      chip.textContent = name;
      $('#tagPicker').insertBefore(chip, $('#tagCustomWrap'));
    }
    closeTagCustom();
    syncTagsInput();
  }

      '<div class="field"><label>要记住的内容 <span style="color:#e5484d">*</span></label>' +
        '<textarea name="front" placeholder="单词、句子、概念、公式、一个人的名字……" required>' + esc(it ? it.front : '') + '</textarea></div>' +
      '<div class="field"><label>内容类型</label>' +
        '<div class="seg" id="kindSeg">' +
          '<button type="button" class="seg-btn' + (kind === 'foreign' ? ' active' : '') + '" data-act="kind" data-kind="foreign">外语</button>' +
          '<button type="button" class="seg-btn' + (kind === 'other' ? ' active' : '') + '" data-act="kind" data-kind="other">其他知识</button>' +
        '</div>' +
        '<input type="hidden" name="kind" id="kindInput" value="' + kind + '">' +
        '<div class="help" id="kindHint">' + (id ? '外语内容可补充音标，并在卡片上朗读' : '输入内容后会自动识别语种，也可以手动切换') + '</div>' +
      '</div>' +
      '<div id="foreignFields" class="foreign-panel' + (kind === 'foreign' ? '' : ' hidden') + '">' +
        '<input type="hidden" name="audio" id="audioInput" value="' + esc(it ? it.audio : '') + '">' +
        '<div class="form-grid-2">' +
          '<div class="field"><label>音标 / 注音</label>' +
            '<input name="phonetic" id="phoneticInput" placeholder="输入单词后自动获取" value="' + esc(it ? it.phonetic : '') + '"></div>' +
          '<div class="field"><label>语言</label>' +
            '<select name="lang" id="langInput">' + langOptions + '</select></div>' +
        '</div>' +
        '<div class="speak-row">' +
          '<button type="button" class="btn ghost sm" data-act="fetchPhonetic">' + icon('search') + '自动获取音标</button>' +
          '<button type="button" class="btn ghost sm" data-act="speakForm">' + icon('volume') + '试听读音</button>' +
        '</div>' +
        '<div class="lookup-state" id="lookupState"></div>' +
        '<p class="help" style="margin:0 0 10px">支持英 / 日 / 韩 / 法 / 德 / 西 / 俄 / 意，自动填入音标并获取在线读音。</p>' +
      '</div>' +
      '<div class="field"><label>答案 / 释义 / 提示</label>' +
        '<textarea name="back" placeholder="写下答案或解释，复习时用来核对">' + esc(it ? it.back : '') + '</textarea></div>' +
      '<div class="field"><label>分类标签</label>' +
        tagPickerHTML(it ? it.tags : []) +
        '<div class="help">点选分类，最多 5 个；也可以新增自己的分类</div></div>' +
      '<div class="field"><label>复习节奏</label><select name="pace">' +
        Object.keys(YK.PACES).map(function (k) {
          return '<option value="' + k + '"' + (pace === k ? ' selected' : '') + '>' + YK.PACES[k].label + '</option>';
        }).join('') +
      '</select><div class="help">' + (it ? '修改节奏会保留已有进度' : '保存后立即进入第 1 个节点') + '</div></div>' +
      paceNoteHTML() +
      '<div class="field"><label>备注</label><input name="note" placeholder="例句、出处或联想" value="' + esc(it ? it.note : '') + '"></div>' +
      '<label class="set-row" style="border:0;padding:4px 0 0">' +
        '<span>加入收藏<em>重点内容单独标记，可在内容库筛选</em></span>' +
        '<span class="switch"><input type="checkbox" name="favorite"' + (it && it.favorite ? ' checked' : '') + '><span></span></span></label>' +
      '<p class="form-error" id="itemError" style="margin-top:8px"></p>' +
    '</form>' +
    '<div class="modal-foot"><span class="spacer"></span>' +
      '<button class="btn ghost" data-act="closeModal" type="button">取消</button>' +
      '<button class="btn primary" type="submit" form="itemForm">' + (it ? '保存修改' : '保存并开始') + '</button></div>';

    setModal(modalHead(it ? '编辑内容' : '添加新内容',
      it ? '修改后会保留当前复习进度' : '保存后自动纳入艾宾浩斯记忆周期') + body);
    setTimeout(function () {
      var f = $('#itemForm');
      if (!f) return;
      if (it) f.dataset.kindTouched = '1';
      if (f.front) f.front.focus();
      if (kind === 'foreign') scheduleLookup();
      var ti = $('#tagCustomInput');
      if (ti) ti.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') {
          ev.preventDefault(); ev.stopPropagation(); commitCustomTag();
        } else if (ev.key === 'Escape') {
          ev.preventDefault(); ev.stopPropagation(); closeTagCustom();
        }
      });
    }, 40);
  }

  /* 切换内容类型：外语时展开音标与读音 */
  function applyFormKind(kind, langCode) {
    var form = $('#itemForm');
    if (!form) return;
    var hidden = $('#kindInput');
    if (hidden) hidden.value = kind;
    $$('#kindSeg .seg-btn').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-kind') === kind);
    });
    var panel = $('#foreignFields');
    if (panel) panel.classList.toggle('hidden', kind !== 'foreign');
    var sel = $('#langInput');
    if (langCode && sel) {
      var exists = Array.prototype.some.call(sel.options, function (o) { return o.value === langCode; });
      if (exists) sel.value = langCode;
    }
    var hint = $('#kindHint');
    if (hint) {
      hint.textContent = kind === 'foreign'
        ? '已识别为外语，可补充音标并试听读音'
        : '将作为普通知识卡片保存，不显示音标与朗读';
    }
  }

  /* ---------- 详情 ---------- */
  function openItemDetail(id) {
    var it = YK.itemById(id);
    if (!it) return;
    var len = it.stages.length;
    var p = Math.round(YK.progressOf(it) * 100);

    var stages = it.stages.map(function (min, i) {
      var cls = i < it.stage ? 'done' : (i === it.stage ? 'current' : '');
      var label = YK.util.fmtDuration(min);
      return '<div class="stage-line ' + cls + '">' +
        '<span class="sname">第 ' + (i + 1) + ' 次</span>' +
        '<span class="dot">' + (i < it.stage ? icon('check') : '') + '</span>' +
        '<span class="sline"></span>' +
        '<span>' + label + '</span></div>';
    }).join('');

    var hist = it.history.slice(-8).reverse();
    var histHTML = hist.length ? hist.map(function (h) {
      var map = { good: ['记忆清晰', 'mint'], fuzzy: ['有点模糊', 'amber'], bad: ['完全忘记', 'rose'] };
      var m = map[h.result] || map.good;
      return '<div class="history-row"><span class="tag ' + m[1] + '">' + m[0] + '</span>' +
        '<span class="muted">第 ' + (h.from + 1) + ' → ' + (h.to + 1) + ' 节点</span>' +
        '<time>' + YK.util.fmtDateTime(h.at) + '</time></div>';
    }).join('') : '<p class="muted" style="font-size:12px">还没有复习记录，完成第一次复习后会显示在这里。</p>';

    var body = '<div class="modal-body">' +
      '<div class="detail-front">' + esc(it.front) + '</div>' +
      phonInline(it) +
      (it.back ? '<div class="detail-back">' + esc(it.back) + '</div>' : '<div class="detail-back muted">（未填写释义）</div>') +
      (it.note ? '<p class="help" style="margin-top:8px">备注：' + esc(it.note) + '</p>' : '') +
      '<div class="detail-meta">' + tagsHTML(it.tags) +
        langTagHTML(it) +
        '<span class="tag grey">' + YK.PACES[it.pace].label + '</span>' +
        '<span class="tag grey">' + YK.stageName(it) + '</span>' +
        (it.paused ? '<span class="tag amber">暂停提醒</span>' : '') +
        (it.favorite ? '<span class="tag amber">已收藏</span>' : '') +
      '</div>' +
      '<div class="detail-stats">' +
        '<div><span>复习阶段</span><b>' + Math.min(it.stage, len) + ' / ' + len + '</b></div>' +
        '<div><span>复习次数</span><b>' + it.history.length + '</b></div>' +
        '<div><span>下次复习</span><b style="font-size:12px">' + (it.paused ? '已暂停' : YK.util.fmtRelative(it.nextAt)) + '</b></div>' +
        '<div><span>掌握度</span><b>' + p + '%</b></div>' +
      '</div>' +
      '<div class="pbar" style="margin-bottom:16px"><span style="width:' + p + '%"></span></div>' +
      '<div class="section-head" style="margin:0 0 10px"><h3 style="font-size:13px">记忆节点</h3>' +
        '<span>依据 ' + YK.PACES[it.pace].label + '</span></div>' +
      '<div class="stage-track">' + stages + '</div>' +
      '<div class="section-head" style="margin:16px 0 6px"><h3 style="font-size:13px">复习记录</h3>' +
        '<span>最近 ' + hist.length + ' 次</span></div>' +
      '<div class="history-list">' + histHTML + '</div>' +
    '</div>' +
    '<div class="modal-foot">' +
      '<button class="btn danger sm" data-act="delItem" data-id="' + it.id + '">删除</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn ghost sm" data-act="editItem" data-id="' + it.id + '">' + icon('edit') + '编辑</button>' +
      '<button class="btn ghost sm" data-act="pauseItem" data-id="' + it.id + '">' + icon('pause') + (it.paused ? '恢复提醒' : '暂停提醒') + '</button>' +
      '<button class="btn primary sm" data-act="startOne" data-id="' + it.id + '">' + icon('play') + '立即复习</button>' +
    '</div>';

    setModal(modalHead('内容详情', '第 ' + Math.min(it.stage + 1, len) + ' / ' + len + ' 个记忆节点') + body, true);
  }

  /* ---------- 复习流程 ---------- */
  function startReview(ids) {
    S.queue = ids.slice();
    S.qi = 0;
    S.revealed = false;
    S.round = { good: 0, fuzzy: 0, bad: 0 };
    renderReview();
  }

  function renderReview() {
    if (S.qi >= S.queue.length) return renderSummary();
    var it = YK.itemById(S.queue[S.qi]);
    if (!it) { S.qi++; return renderReview(); }

    var total = S.queue.length;
    var pct = Math.round((S.qi / total) * 100);
    var len = it.stages.length;

    var card = '<div class="flashcard" data-act="reveal">' +
      (it.tags.length ? '<div class="fc-tag">' + tagsHTML(it.tags) + '</div>' : '') +
      '<div class="fc-front">' + esc(it.front) + '</div>' +
      (it.kind === 'foreign'
        ? '<div class="fc-phon">' +
            (it.phonetic ? '<span class="phonetic">' + esc(it.phonetic) + '</span>' : '') +
            speakBtn(it) +
          '</div>'
        : '') +
      (S.revealed
        ? '<div class="fc-divider"></div>' +
          (it.back ? '<div class="fc-back">' + esc(it.back) + '</div>' : '<div class="fc-back muted">没有填写释义，凭记忆回想即可</div>') +
          (it.note ? '<div class="fc-note">' + esc(it.note) + '</div>' : '')
        : '<div class="fc-hint">点击卡片，查看答案</div>') +
    '</div>';

    var answers = S.revealed
      ? '<div class="answer-row">' +
          '<button class="answer-btn bad" data-act="answer" data-result="bad"><strong>忘记了</strong><em>回到较早节点</em></button>' +
          '<button class="answer-btn fuzzy" data-act="answer" data-result="fuzzy"><strong>有点模糊</strong><em>缩短间隔</em></button>' +
          '<button class="answer-btn good" data-act="answer" data-result="good"><strong>记得</strong><em>进入下一节点</em></button>' +
        '</div>'
      : '<button class="btn primary full" data-act="reveal" style="margin-top:16px">' + icon('play') + '显示答案</button>' +
        '<p class="help" style="text-align:center;margin-top:8px">先在心里回想一遍，再看答案</p>';

    var body = '<div class="modal-body">' +
      '<div class="review-progress">' +
        '<div class="pbar"><span style="width:' + pct + '%"></span></div>' +
        '<small>' + (S.qi + 1) + ' / ' + total + '</small>' +
      '</div>' + card + answers +
      '<p class="help" style="margin-top:14px;text-align:center">当前：' + YK.PACES[it.pace].label +
        ' · 第 ' + Math.min(it.stage + 1, len) + '/' + len + ' 节点 · 快捷键 空格 / 1 2 3</p>' +
    '</div>';

    setModal(modalHead('复习进行中', '按自己的记忆情况作答，排期会自动调整') + body, true);
  }

  function answer(result) {
    if (!S.revealed) return;
    var id = S.queue[S.qi];
    var res = YK.reviewItem(id, result);
    if (!res) return;
    S.round[result]++;
    S.qi++;
    S.revealed = false;

    var msg = result === 'good'
      ? '下次复习：' + YK.util.fmtRelative(res.nextAt)
      : (result === 'fuzzy' ? '模糊 · ' + YK.util.fmtRelative(res.nextAt) + ' 再巩固' : '已回退节点 · 5 分钟后重新复习');
    toast(msg);

    showUnlocked(res.unlocked);
    updateChrome();
    renderReview();
  }

  function renderSummary() {
    var r = S.round || { good: 0, fuzzy: 0, bad: 0 };
    var total = r.good + r.fuzzy + r.bad;
    var body = '<div class="modal-body"><div class="review-summary">' +
      '<h3>本轮复习完成</h3>' +
      '<p>共 ' + total + ' 张 · 记忆清晰 ' + Math.round(r.good / Math.max(1, total) * 100) + '%</p>' +
      '<div class="summary-grid">' +
        '<div><b style="color:#10a37f">' + r.good + '</b><span>记得</span></div>' +
        '<div><b style="color:#e8960c">' + r.fuzzy + '</b><span>模糊</span></div>' +
        '<div><b style="color:#e5484d">' + r.bad + '</b><span>忘记</span></div>' +
      '</div>' +
      '<p class="muted" style="font-size:12px;margin-top:10px">答对的内容已经排到下一个记忆节点，忘记的内容 5 分钟后会再次出现。</p>' +
    '</div></div>' +
    '<div class="modal-foot"><span class="spacer"></span>' +
      '<button class="btn primary" data-act="closeModal">完成</button></div>';
    setModal(modalHead('复习小结', niceDate()) + body, true);
    S.queue = [];
    refresh();
  }

  /* ================= 事件 ================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');

    if (act === 'backdrop') {
      if (e.target === el) closeModal();
      return;
    }

    switch (act) {
      case 'goToday':
        setView('today');
        break;
      case 'add':
        openItemForm(null);
        break;
      case 'kind': {
        var form = $('#itemForm');
        var nextKind = el.getAttribute('data-kind');
        var text = form && form.front ? form.front.value : '';
        applyFormKind(nextKind, nextKind === 'foreign' ? (YK.detectLang(text) || 'en-US') : '');
        if (form) form.dataset.kindTouched = '1';
        if (nextKind === 'foreign') scheduleLookup();
        else setLookupState('', '');
        break;
      }
      case 'tagToggle': {
        var picked = el.classList.toggle('on');
        if (picked && pickedTags().length > 5) {
          el.classList.remove('on');
          toast('标签最多 5 个');
        }
        syncTagsInput();
        break;
      }
      case 'tagAdd': {
        var tw = $('#tagCustomWrap');
        if (tw) tw.classList.remove('hidden');
        el.classList.add('hidden');
        var ti = $('#tagCustomInput');
        if (ti) ti.focus();
        break;
      }
      case 'tagCustomOk':
        commitCustomTag();
        break;
      case 'speakForm': {
        var fi = $('#itemForm');
        speak(fi && fi.front ? fi.front.value : '', fi && fi.lang ? fi.lang.value : '', fi && fi.audio ? fi.audio.value : '');
        break;
      }
      case 'fetchPhonetic': {
        var lf = $('#itemForm');
        if (!lf || !splitWords(lf.front.value).length) {
          toast('请先填写要记住的外语内容');
          break;
        }
        lookupText(lf, lf.front.value, lf.lang ? lf.lang.value : 'en-US');
        break;
      }
      case 'speak': {
        var spoken = YK.itemById(id);
        if (spoken) speak(spoken.front, spoken.lang, spoken.audio);
        break;
      }
      case 'closeModal':
        closeModal();
        break;
      case 'detail':
        openItemDetail(id);
        break;
      case 'editItem':
        openItemForm(id);
        break;
      case 'fav': {
        e.stopPropagation();
        var r = YK.toggleFavorite(id);
        if (r) {
          showUnlocked(r.unlocked);
          toast(r.item.favorite ? '已加入收藏' : '已取消收藏');
          refresh();
        }
        break;
      }
      case 'pauseItem': {
        var p = YK.togglePause(id);
        if (p) {
          toast(p.paused ? '已暂停该内容的提醒' : '已恢复复习提醒');
          openItemDetail(id);
          refresh();
        }
        break;
      }
      case 'delItem': {
        if (window.confirm('确定删除这条内容？复习进度也会一并删除。')) {
          YK.deleteItem(id);
          closeModal();
          toast('已删除');
          refresh();
        }
        break;
      }
      case 'startOne':
        closeModal();
        startReview([id]);
        break;
      case 'startAll':
        startReview(YK.dueItems().map(function (i) { return i.id; }));
        break;
      case 'reveal':
        if (!S.revealed) {
          S.revealed = true;
          renderReview();
        }
        break;
      case 'answer':
        answer(el.getAttribute('data-result'));
        break;
      case 'filterStatus':
        S.filter.status = el.getAttribute('data-status');
        renderView('library');
        break;
      case 'publish': {
        var input = $('#postInput');
        var tag = $('#postTag');
        var cardSel = $('#postCard');
        Promise.resolve().then(function () {
          return YK.addPost({
            content: input ? input.value : '',
            tag: tag ? tag.value : '学习打卡',
            cardId: cardSel ? cardSel.value : ''
          });
        }).then(function (res) {
          S.draft = '';
          showUnlocked(res.unlocked);
          toast('已发布到社区');
          renderView('community');
        }).catch(function (err) {
          toast(err.message);
        });
        break;
      }
      case 'like': {
        Promise.resolve().then(function () {
          return YK.toggleLike(id);
        }).then(function (likeRes) {
          if (likeRes) {
            showUnlocked(likeRes.unlocked);
            renderView('community');
          }
        }).catch(function (err) {
          toast(err.message);
        });
        break;
      }
      case 'refreshFeed': {
        toast('正在刷新动态…');
        YK.refreshPosts().then(function () {
          renderView('community');
          toast('已是最新');
        }).catch(function (err) {
          toast(err.message);
        });
        break;
      }
      case 'commentFocus': {
        var post = document.querySelector('[data-post="' + id + '"]');
        if (post) {
          post.classList.add('show-comment');
          var inp = post.querySelector('.comment-form input');
          if (inp) inp.focus();
        }
        break;
      }
      case 'delPost': {
        if (window.confirm('删除这条动态？')) {
          Promise.resolve().then(function () {
            return YK.deletePost(id);
          }).then(function () {
            renderView('community');
          }).catch(function (err) {
            toast(err.message);
          });
        }
        break;
      }
      case 'saveName': {
        Promise.resolve().then(function () {
          return YK.renameUser($('#setName').value);
        }).then(function () {
          toast('昵称已更新');
          refresh();
        }).catch(function (err) {
          toast(err.message);
        });
        break;
      }
      case 'saveSettings': {
        YK.saveSettings({
          dailyTime: $('#setTime').value || '09:00',
          pace: $('#setPace').value
        });
        toast('设置已保存');
        refresh();
        break;
      }
      case 'enableNotify':
        requestNotify();
        break;
      case 'export': {
        var data = YK.exportJSON();
        var blob = new Blob([data], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'yike-backup-' + YK.util.dayKey(Date.now()) + '.json';
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
        toast('已导出备份文件');
        break;
      }
      case 'wipe': {
        if (window.confirm('清空我的全部内容与成就进度？此操作不可撤销。')) {
          YK.wipeMine();
          toast('内容已清空');
          setView('today');
        }
        break;
      }
      case 'logout':
        Promise.resolve(YK.logout()).then(function () {
          closeModal();
          showAuth();
        });
        break;
    }
  });

  /* 导航按钮 */
  document.addEventListener('click', function (e) {
    var nav = e.target.closest('.nav-item[data-view]');
    if (nav) setView(nav.getAttribute('data-view'));
  });

  /* 表单提交 */
  document.addEventListener('submit', function (e) {
    var form = e.target;

    if (form.id === 'itemForm') {
      e.preventDefault();
      var fd = new FormData(form);
      var id = form.getAttribute('data-id');
      var payload = {
        front: fd.get('front'),
        back: fd.get('back'),
        tags: fd.get('tags'),
        note: fd.get('note'),
        pace: fd.get('pace'),
        favorite: fd.get('favorite') === 'on',
        kind: fd.get('kind'),
        phonetic: fd.get('phonetic'),
        lang: fd.get('lang'),
        audio: fd.get('audio')
      };
      try {
        if (id) {
          YK.updateItem(id, payload);
          toast('已保存修改');
        } else {
          var res = YK.addItem(payload);
          showUnlocked(res.unlocked);
          toast('已加入记忆周期 · 5 分钟后第一次巩固');
        }
        closeModal();
        refresh();
      } catch (err) {
        var errEl = $('#itemError');
        if (errEl) errEl.textContent = err.message;
      }
      return;
    }

    if (form.hasAttribute('data-comment')) {
      e.preventDefault();
      var text = form.querySelector('input[name="text"]').value;
      if (text.trim()) {
        Promise.resolve().then(function () {
          return YK.addComment(form.getAttribute('data-comment'), text);
        }).then(function () {
          renderView('community');
        }).catch(function (err) {
          toast(err.message);
        });
      }
      return;
    }
  });

  /* 输入与筛选 */
  document.addEventListener('input', function (e) {
    if (e.target.name === 'front' && e.target.form && e.target.form.id === 'itemForm') {
      var form = e.target.form;
      if (form.dataset.kindTouched !== '1') {
        var detected = YK.detectLang(e.target.value);
        var manualLang = form.dataset.langTouched === '1' && form.lang ? form.lang.value : '';
        applyFormKind(detected ? 'foreign' : 'other', manualLang || detected);
      }
      scheduleLookup();
    }
    if (e.target.id === 'phoneticInput') e.target.dataset.auto = '';
    if (e.target.id === 'libSearch') {
      S.filter.q = e.target.value;
      var host = $('#view-library');
      var pos = e.target.selectionStart;
      host.innerHTML = libraryHTML();
      var next = $('#libSearch');
      if (next) { next.focus(); try { next.setSelectionRange(pos, pos); } catch (err) {} }
    }
    if (e.target.id === 'postInput') S.draft = e.target.value;
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'libSort') {
      S.filter.sort = e.target.value;
      renderView('library');
    }
    if (e.target.id === 'langInput') {
      var lf = $('#itemForm');
      if (lf) lf.dataset.langTouched = '1';
      scheduleLookup();
    }
    if (e.target.id === 'setNotify') {
      if (e.target.checked) {
        requestNotify();
      } else {
        YK.saveSettings({ notify: false });
        toast('已关闭到期提醒');
      }
    }
  });

  /* 键盘 */
  document.addEventListener('keydown', function (e) {
    var modalOpen = !!document.querySelector('.modal-backdrop');
    if (e.key === 'Escape' && modalOpen) closeModal();

    if (!modalOpen || S.qi >= S.queue.length) return;
    if (e.code === 'Space' || e.key === 'Enter') {
      if (!S.revealed) { e.preventDefault(); S.revealed = true; renderReview(); }
    }
    if (S.revealed) {
      if (e.key === '1') answer('bad');
      if (e.key === '2') answer('fuzzy');
      if (e.key === '3') answer('good');
    }
  });

  /* ================= 通知与时钟 ================= */
  function requestNotify() {
    if (!('Notification' in window)) {
      toast('当前浏览器不支持通知');
      var cb = $('#setNotify'); if (cb) cb.checked = false;
      return;
    }
    try {
      Notification.requestPermission().then(function (perm) {
        var on = perm === 'granted';
        YK.saveSettings({ notify: on });
        if (on) toast('已开启到期提醒');
        else toast('通知权限被拒绝，将只在页面内提示');
        refresh();
      });
    } catch (err) {
      toast('无法申请通知权限，将只在页面内提示');
    }
  }

  function tick() {
    if (!YK.currentUser()) return;
    updateChrome();
    if (S.view === 'today') renderView('today');
    checkReminder();
  }

  function checkReminder() {
    var s = YK.settings();
    var due = YK.dueItems();
    if (!due.length) return;
    if (Date.now() - S.lastNotify < 20 * 60 * 1000) return;

    if (s.notify && 'Notification' in window && Notification.permission === 'granted') {
      try {
        new Notification('忆刻 · 该复习了', {
          body: '有 ' + due.length + ' 张卡片到期，几分钟就能完成。',
          tag: 'yike-due'
        });
        S.lastNotify = Date.now();
      } catch (err) { /* file:// 下可能不可用 */ }
      return;
    }

    if (s.dailyTime) {
      var now = new Date();
      var parts = s.dailyTime.split(':');
      var target = new Date();
      target.setHours(Number(parts[0]) || 0, Number(parts[1]) || 0, 0, 0);
      var diff = now - target;
      var lastKey = 'yike.daily.' + YK.util.dayKey(now.getTime());
      var fired = false;
      try { fired = !!sessionStorage.getItem(lastKey); } catch (err) { fired = false; }
      if (diff >= 0 && diff < 60000 && !fired) {
        try { sessionStorage.setItem(lastKey, '1'); } catch (err) {}
        toast('每日提醒 · 今天有 ' + due.length + ' 张卡片待复习');
        S.lastNotify = Date.now();
      }
    }
  }

  /* ================= 提示 ================= */
  function toast(msg, type) {
    var root = $('#toastRoot');
    if (!root) return;
    var el = document.createElement('div');
    el.className = 'toast' + (type === 'award' ? ' award' : '');
    el.innerHTML = (type === 'award' ? icon('trophy') : '') + '<span>' + msg + '</span>';
    root.appendChild(el);
    setTimeout(function () {
      el.classList.add('out');
      setTimeout(function () { el.remove(); }, 260);
    }, type === 'award' ? 4200 : 2800);
  }

  function showUnlocked(list) {
    if (!list || !list.length) return;
    list.forEach(function (d, i) {
      setTimeout(function () {
        toast('成就解锁 · <strong>' + esc(d.name) + '</strong>', 'award');
      }, i * 500);
    });
  }
})();

</script>
</body>
</html>
